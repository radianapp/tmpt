<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMPT Dashboard</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg?v=2">
    <link rel="stylesheet" href="/shared/pico.min.css">
    <link rel="stylesheet" href="/shared/app.css?v=2">
    <link rel="stylesheet" href="/app/app-dashboard.css">
    <script src="/shared/htmx.min.js"></script>
    <script src="/shared/pwa.js"></script>
    <script src="/shared/crypto.js"></script>
    <script src="/shared/vault.js"></script>
    <script src="/shared/auth.js"></script>
    <script src="/shared/ui.js"></script>
</head>
<body>

    <script>
        // Check auth before rendering anything
        (async () => {
            await window.TMPT_Auth.init();
            window.TMPT_Auth.requireAuth();
        })();
    </script>

    <!-- Shared header -->
    <div id="header-container" hx-get="/shared/app-header.html?v=4" hx-trigger="load" hx-swap="outerHTML"></div>

    <div class="dashboard-wrapper">
        <!-- Sidebar Kiri -->
        <aside class="dashboard-sidebar" id="dashboard-sidebar">
            <div class="sidebar-logo">
                <button id="sidebar-collapse-btn" class="sidebar-collapse-btn" aria-label="Collapse Sidebar" title="Collapse Sidebar">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="4" y1="6" x2="20" y2="6"></line>
                        <line x1="4" y1="12" x2="20" y2="12"></line>
                        <line x1="4" y1="18" x2="20" y2="18"></line>
                    </svg>
                </button>
                <img src="/assets/img/logo.svg?v=2" alt="Logo" class="logo-img">
                <span class="logo-text">TMPT</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="sidebar-link active" data-filter="all">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                        <rect x="4" y="4" width="6" height="6" rx="1"></rect>
                        <rect x="14" y="4" width="6" height="6" rx="1"></rect>
                        <rect x="4" y="14" width="6" height="6" rx="1"></rect>
                        <rect x="14" y="14" width="6" height="6" rx="1"></rect>
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="sidebar-link" data-filter="favorite">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                        <path d="M12 17.75l-6.172 3.245l1.179 -6.873l-5 -4.867l6.9 -1l3.086 -6.253l3.086 6.253l6.9 1l-5 4.867l1.179 6.873z"></path>
                    </svg>
                    <span>Favorit</span>
                </a>
                <a href="#" class="sidebar-link" data-filter="kerja">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                        <path d="M3 7m0 2a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v9a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2z"></path>
                        <path d="M8 7v-2a2 2 0 0 1 2 -2h4a2 2 0 0 1 2 2v2"></path>
                        <path d="M12 12l0 .01"></path>
                        <path d="M3 13a20 20 0 0 0 18 0"></path>
                    </svg>
                    <span>TMPT Kerja</span>
                </a>
                <a href="#" class="sidebar-link" data-filter="dev">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                        <path d="M7 8l-4 4l4 4"></path>
                        <path d="M17 8l4 4l-4 4"></path>
                        <path d="M14 4l-4 16"></path>
                    </svg>
                    <span>TMPT Dev</span>
                </a>
                <a href="#" class="sidebar-link" data-filter="tools">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                        <path d="M7 10h3v-3l-3.5 -3.5a6 6 0 0 1 8 8l6 6a2 2 0 0 1 -3 3l-6-6a6 6 0 0 1 -8 -8l3.5 3.5"></path>
                    </svg>
                    <span>TMPT Tools</span>
                </a>
                <hr class="sidebar-divider">
                
            </nav>
        </aside>

        <!-- Area Konten Utama -->
        <div class="dashboard-main">


            <main class="dashboard-content-area" id="dashboard-content">
                <!-- Diisi secara dinamis oleh app-dashboard.js -->
            </main>

            <!-- Status Keamanan Bar -->
            <footer class="security-status-bar">
                <div class="status-item">
                    <span class="dot dot-green"></span>
                    <span>Status TMPT: <strong id="status-lock-text">Terbuka</strong></span>
                </div>
                <div class="status-item">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="3" width="20" height="14" rx="2"></rect>
                        <line x1="8" y1="21" x2="16" y2="21"></line>
                        <line x1="12" y1="17" x2="12" y2="21"></line>
                    </svg>
                    <span>Lokasi Data: <strong>Browser Lokal</strong></span>
                </div>
                <div class="status-item">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                        <path d="M7 11v-4a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span>Enkripsi: <strong>AES-256-GCM</strong></span>
                </div>
            </footer>
        </div>
    </div>

    <div id="toast-container" aria-live="polite"></div>
    <script src="/app/app-dashboard.js"></script>
</body>
</html>
