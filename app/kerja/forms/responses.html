<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tanggapan Formulir — TMPT Forms</title>
  <link rel="manifest" href="/manifest.json">
  
  <!-- Tempatkan kode berikut di dalam tag <head> website Anda -->
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico">


  <link rel="stylesheet" href="/shared/pico.min.css">
  <link rel="stylesheet" href="/shared/app.css?v=3">
  <link rel="stylesheet" href="./forms.css">
  <script src="/shared/htmx.min.js"></script>
  <script src="/shared/pwa.js"></script>
  <script src="/shared/crypto.js"></script>
  <script src="/shared/vault.js"></script>
  <script src="/shared/auth.js"></script>
  <script src="/shared/ui.js"></script>
</head>
<body>
  <script>
    // Cek otentikasi sebelum merender halaman
    (async () => {
      await window.TMPT_Auth.init();
      window.TMPT_Auth.requireAuth();
      if (window.TMPT_Auth.isUnlocked()) {
        window.TMPT_Auth.setupIdleListeners();
      }
    })();
  </script>
  
  <div id="header-container" hx-get="/shared/app-header.html" hx-trigger="load" hx-swap="outerHTML"></div>

  <main id="main-content" class="container forms-dashboard-container">
    
    <div class="builder-header">
      <div class="builder-header-title">
        <a href="./index.html" style="font-size: 1.5rem; text-decoration: none;" aria-label="Kembali ke Dashboard">←</a>
        <h2 id="responses-form-title" style="margin: 0; font-weight: 700;">Tanggapan Formulir</h2>
      </div>
      <div class="builder-header-actions" style="display: flex; gap: 0.5rem;">
        <button id="btn-export-csv" class="outline secondary" style="font-size: 0.85rem;">⬇ CSV</button>
        <button id="btn-export-json" class="outline secondary" style="font-size: 0.85rem;">⬇ JSON</button>
        <button id="btn-delete-responses" class="outline secondary" style="color: var(--pico-danger-color); border-color: var(--pico-danger-color); font-size: 0.85rem;">🗑️ Hapus Semua</button>
      </div>
    </div>

    <!-- Stats & Tabs -->
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem;">
      <div style="font-size: 1.25rem;">
        Total Tanggapan: <strong id="responses-count-badge">0</strong>
      </div>
      <div class="responses-tabs">
        <button class="responses-tab-btn active" id="tab-summary">📊 Ringkasan</button>
        <button class="responses-tab-btn" id="tab-individual">📋 Individual</button>
      </div>
    </div>

    <!-- Summary Content View -->
    <div id="summary-view-content" class="visible">
      <!-- Generated dynamically by responses.js -->
    </div>

    <!-- Individual Content View (Table representation) -->
    <div id="individual-view-content" class="hidden" style="overflow-x: auto;">
      <table class="striped" id="individual-table">
        <thead>
          <tr id="individual-table-headers">
            <th>Waktu Submit</th>
            <!-- Question labels here -->
          </tr>
        </thead>
        <tbody id="individual-table-rows">
          <!-- Filled by responses.js -->
        </tbody>
      </table>
    </div>

  </main>

  <!-- Dialog Konfirmasi -->
  <dialog id="confirm-modal">
    <article style="border-radius: 20px; padding: 2.5rem; max-width: 480px; text-align: center;">
      <div style="font-size: 3rem; margin-bottom: 1rem; color: #dc2626;">⚠️</div>
      <h3 id="confirm-title" style="font-weight: 700; margin-bottom: 0.5rem;">Konfirmasi</h3>
      <p id="confirm-message" class="secondary" style="margin-bottom: 1.5rem;">Apakah Anda yakin?</p>
      <div style="display: flex; gap: 1rem; justify-content: center; width: 100%;">
        <button class="btn-gray" onclick="document.getElementById('confirm-modal')._resolve(false); document.getElementById('confirm-modal').close()" style="flex: 1; margin:0; border-radius: 8px;">Batal</button>
        <button class="btn-navy" id="confirm-ok-btn" onclick="document.getElementById('confirm-modal')._resolve(true); document.getElementById('confirm-modal').close()" style="flex: 1; margin:0; border-radius: 8px;">Lanjutkan</button>
      </div>
    </article>
  </dialog>

  <script type="module" src="./responses.js"></script>
</body>
</html>
