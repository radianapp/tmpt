<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pindai (Scan) QR Code — TMPT QR</title>
  
<!-- Tempatkan kode berikut di dalam tag <head> website Anda -->
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16x16.png">
<link rel="shortcut icon" href="/favicon.ico">


  <link rel="stylesheet" href="/shared/pico.min.css">
  <link rel="stylesheet" href="/shared/app.css?v=2">
  <link rel="stylesheet" href="./css/qr.css">
  
  <script src="/shared/htmx.min.js"></script>
  <script src="/shared/pwa.js"></script>
  <script src="/shared/crypto.js"></script>
  <script src="/shared/vault.js"></script>
  <script src="/shared/auth.js"></script>
  <script src="/shared/ui.js"></script>
  <script src="/shared/version.js"></script>
  
  <!-- Decoder library -->
  <script src="./vendor/jsqr.min.js"></script>
</head>
<body>
  <script>
    (async () => {
      await window.TMPT_Auth.init();
      window.TMPT_Auth.requireAuth();
    })();
  </script>

  <div id="header-container" hx-get="/shared/app-header.html" hx-trigger="load" hx-swap="outerHTML"></div>

  <main class="container" id="scanner-page">
    <div class="qr-container" style="max-width: 600px; margin: 0 auto;">
      <div class="flex-between">
        <div>
          <h1 style="font-size: 1.75rem; font-weight: 800; margin-bottom: 0.15rem;">📷 Pindai QR Code</h1>
          <p class="secondary" style="font-size: 0.9rem; margin-bottom: 0;">Scan menggunakan kamera perangkat atau unggah berkas gambar QR.</p>
        </div>
        <a href="index.html" class="button outline secondary" style="margin-bottom: 0;">← Kembali</a>
      </div>

      <!-- Tab View Controllers -->
      <nav style="margin-bottom: 1.5rem;">
        <ul style="border-bottom: 1px solid var(--pico-muted-border-color); width: 100%; padding-bottom: 0.25rem;">
          <li><button class="outline secondary active" id="tab-camera" style="border: none; padding: 0.5rem 1rem;">📷 Kamera Langsung</button></li>
          <li><button class="outline secondary" id="tab-upload" style="border: none; padding: 0.5rem 1rem;">📁 Unggah Gambar</button></li>
        </ul>
      </nav>

      <!-- VIEW 1: Camera Streaming viewport -->
      <div id="scanner-camera-section" class="scanner-section">
        <div class="scanner-viewport">
          <video id="scanner-video" autoplay playsinline></video>
          <canvas id="scanner-canvas"></canvas>
          <div class="scanner-overlay">
            <div class="scanner-target-box">
              <div class="scanner-laser"></div>
            </div>
          </div>
        </div>
        <p class="secondary" style="text-align: center; margin-top: 0.75rem; font-size: 0.85rem;">
          Posisikan kode QR di dalam bingkai sorotan untuk memindai otomatis.
        </p>
      </div>

      <!-- VIEW 2: Upload Zone -->
      <div id="scanner-upload-section" class="scanner-section hidden">
        <div class="bulk-upload-zone" id="upload-zone">
          <span style="font-size: 2.5rem; display: block; margin-bottom: 0.5rem;">📥</span>
          <strong>Klik atau Seret berkas gambar ke sini</strong>
          <p class="secondary" style="font-size: 0.8rem; margin-bottom: 0;">Mendukung berkas gambar PNG, JPG, JPEG, atau WebP</p>
          <input type="file" id="upload-qr" accept="image/*" style="display: none;">
        </div>
      </div>

      <!-- Diagnostic Results Box -->
      <div class="scanner-result-box hidden" id="scanner-result-box">
        <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 0.75rem;">Hasil Pemindaian</h3>
        
        <div id="scan-result-meta" style="font-size: 0.85rem; margin-bottom: 0.5rem;">
          <!-- Tipe terdeteksi -->
        </div>

        <div style="background: var(--pico-background-color); border: 1px solid var(--pico-muted-border-color); padding: 0.75rem; border-radius: 8px; font-family: monospace; word-break: break-all; margin-bottom: 1rem; max-height: 150px; overflow-y: auto;" id="scan-result-content">
          <!-- Raw Content -->
        </div>

        <div class="grid" style="grid-template-columns: repeat(3, 1fr); gap: 0.5rem;">
          <a href="#" target="_blank" class="button hidden" id="scan-open-url" style="margin-bottom: 0; font-size: 0.85rem; padding: 0.5rem 0.25rem;">🌐 Buka URL</a>
          <button class="outline primary" id="scan-copy" style="margin-bottom: 0; font-size: 0.85rem; padding: 0.5rem 0.25rem;">📋 Salin Teks</button>
          <button class="outline secondary" id="scan-recreate" style="margin-bottom: 0; font-size: 0.85rem; padding: 0.5rem 0.25rem;">🔗 Buat QR Baru</button>
        </div>
      </div>

    </div>
  </main>

  <div id="footer-container" hx-get="/shared/footer.html" hx-trigger="load" hx-swap="outerHTML"></div>
  <div id="toast-container" aria-live="polite"></div>

  <!-- Main script orchestrator -->
  <script type="module" src="./js/qr-app.js"></script>
</body>
</html>
