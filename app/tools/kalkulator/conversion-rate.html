<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalkulator Tingkat Konversi — TMPT</title>
  
<!-- Tempatkan kode berikut di dalam tag <head> website Anda -->
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16x16.png">
<link rel="shortcut icon" href="/favicon.ico">


  <link rel="stylesheet" href="/shared/pico.min.css">
  <link rel="stylesheet" href="/shared/app.css?v=2">
  <link rel="stylesheet" href="./css/kalkulator.css">
  <script src="/shared/htmx.min.js"></script>
  <script src="/shared/pwa.js"></script>
  <script src="/shared/ui.js"></script>
</head>
<body>
  <div id="header-container" hx-get="/shared/header.html" hx-trigger="load" hx-swap="outerHTML"></div>

  <main class="container">
    <a href="./index.html" class="secondary" style="display: inline-flex; align-items: center; gap: 0.25rem; margin-bottom: 1.5rem; text-decoration: none;">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Kembali ke Dashboard
    </a>

    <div class="calc-title-bar">
      <h2>📈 Kalkulator Tingkat Konversi (Conversion Rate)</h2>
      <div class="calc-actions">
        <button class="calc-action-btn secondary" id="bookmark-btn">⭐ Favorit</button>
      </div>
    </div>

    <div class="calc-container split-equal">
      <div class="calc-box">
        <form id="cr-form" onsubmit="return false;">
          <div class="form-group">
            <label for="visitors">Jumlah Pengunjung / Sesi</label>
            <input type="number" id="visitors" value="10000" required>
          </div>
          <div class="form-group">
            <label for="conversions">Jumlah Tindakan / Konversi</label>
            <input type="number" id="conversions" value="250" required>
          </div>
          <button type="button" class="btn-navy" id="btn-calculate" style="width: 100%;">Hitung Tingkat Konversi</button>
        </form>
      </div>

      <div class="calc-box" style="display: flex; flex-direction: column; justify-content: center;">
        <div class="calc-result-box">
          <span class="calc-result-label">Tingkat Konversi (CR)</span>
          <div class="calc-result-value" id="cr-result">-</div>
          <span class="calc-result-badge badge-success" id="cr-benchmark">Siap hitung</span>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container" hx-get="/shared/footer.html" hx-trigger="load" hx-swap="outerHTML"></div>
  <div id="toast-container" aria-live="polite"></div>

  <script type="module">
    import { toggleBookmark, getBookmarks, saveHistoryEntry } from './js/kalkulator-core.js';

    const slug = 'conversion-rate';
    const calcName = 'Tingkat Konversi';

    document.addEventListener('DOMContentLoaded', () => {
      const bbtn = document.getElementById('bookmark-btn');
      if (getBookmarks().includes(slug)) bbtn.textContent = '⭐ Terfavorit';
      bbtn.addEventListener('click', () => {
        const isB = toggleBookmark(slug);
        bbtn.textContent = isB ? '⭐ Terfavorit' : '⭐ Favorit';
      });

      document.getElementById('btn-calculate').addEventListener('click', runCalculation);
    });

    function runCalculation() {
      const visitors = parseInt(document.getElementById('visitors').value);
      const conversions = parseInt(document.getElementById('conversions').value);

      if (!visitors) return;

      const cr = (conversions / visitors) * 100;
      
      document.getElementById('cr-result').textContent = cr.toFixed(2) + '%';
      
      const benchmark = document.getElementById('cr-benchmark');
      if (cr < 1) {
        benchmark.textContent = 'Di bawah rata-rata (Rendah)';
        benchmark.className = 'calc-result-badge badge-danger';
      } else if (cr >= 1 && cr < 3) {
        benchmark.textContent = 'Rata-rata industri (Sedang)';
        benchmark.className = 'calc-result-badge badge-warning';
      } else {
        benchmark.textContent = 'Sangat Bagus (Tinggi)';
        benchmark.className = 'calc-result-badge badge-success';
      }

      saveHistoryEntry(slug, calcName, { visitors, conversions }, { value: cr.toFixed(2) + '%' });
    }
  </script>
</body>
</html>
