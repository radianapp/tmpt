<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalkulator Margin of Error — TMPT</title>
  
<!-- Tempatkan kode berikut di dalam tag <head> website Anda -->
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16x16.png">
<link rel="shortcut icon" href="/favicon.ico">


  <link rel="stylesheet" href="/shared/pico.min.css">
  <link rel="stylesheet" href="/shared/app.css?v=2">
  <link rel="stylesheet" href="./css/kalkulator.css">
  <script src="/shared/htmx.min.js"></script>
  <script src="/shared/pwa.js"></script>
  <script src="/shared/ui.js"></script>
</head>
<body>
  <div id="header-container" hx-get="/shared/header.html" hx-trigger="load" hx-swap="outerHTML"></div>

  <main class="container">
    <a href="./index.html" class="secondary" style="display: inline-flex; align-items: center; gap: 0.25rem; margin-bottom: 1.5rem; text-decoration: none;">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Kembali ke Dashboard
    </a>

    <div class="calc-title-bar">
      <h2>🎯 Kalkulator Margin of Error</h2>
      <div class="calc-actions">
        <button class="calc-action-btn secondary" id="bookmark-btn">⭐ Favorit</button>
      </div>
    </div>

    <div class="calc-container split-equal">
      <div class="calc-box">
        <form id="moe-form" onsubmit="return false;">
          <div class="form-group">
            <label for="sample-size">Ukuran Sampel (n)</label>
            <input type="number" id="sample-size" value="400" required>
          </div>

          <div class="form-group">
            <label for="conf-level">Tingkat Kepercayaan (%)</label>
            <select id="conf-level">
              <option value="90">90% (Z = 1.645)</option>
              <option value="95" selected>95% (Z = 1.96)</option>
              <option value="99">99% (Z = 2.576)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="proportion">Proporsi Responden (%)</label>
            <input type="number" id="proportion" value="50" min="1" max="99" step="1">
          </div>

          <button type="button" class="btn-navy" id="btn-calculate" style="width: 100%;">Hitung Margin of Error</button>
        </form>
      </div>

      <div class="calc-box" style="display: flex; flex-direction: column; justify-content: center;">
        <div class="calc-result-box">
          <span class="calc-result-label">Margin of Error</span>
          <div class="calc-result-value" id="moe-result">-</div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container" hx-get="/shared/footer.html" hx-trigger="load" hx-swap="outerHTML"></div>
  <div id="toast-container" aria-live="polite"></div>

  <script type="module">
    import { toggleBookmark, getBookmarks, saveHistoryEntry } from './js/kalkulator-core.js';

    const slug = 'margin-of-error';
    const calcName = 'Margin of Error';

    document.addEventListener('DOMContentLoaded', () => {
      const bbtn = document.getElementById('bookmark-btn');
      if (getBookmarks().includes(slug)) bbtn.textContent = '⭐ Terfavorit';
      bbtn.addEventListener('click', () => {
        const isB = toggleBookmark(slug);
        bbtn.textContent = isB ? '⭐ Terfavorit' : '⭐ Favorit';
      });

      document.getElementById('btn-calculate').addEventListener('click', runCalculation);
    });

    function runCalculation() {
      const n = parseInt(document.getElementById('sample-size').value);
      const confidence = parseFloat(document.getElementById('conf-level').value);
      const p = parseFloat(document.getElementById('proportion').value) / 100;

      if (!n || n <= 0) return;

      const zScores = { 90: 1.645, 95: 1.96, 99: 2.576 };
      const Z = zScores[confidence] || 1.96;

      const moe = Z * Math.sqrt((p * (1 - p)) / n) * 100;

      document.getElementById('moe-result').textContent = '± ' + moe.toFixed(2) + '%';
      saveHistoryEntry(slug, calcName, { n, confidence }, { value: moe.toFixed(2) + '%' });
    }
  </script>
</body>
</html>
