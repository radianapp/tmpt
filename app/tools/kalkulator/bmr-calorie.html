<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalkulator BMR &amp; Kalori — TMPT</title>
  
<!-- Tempatkan kode berikut di dalam tag <head> website Anda -->
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16x16.png">
<link rel="shortcut icon" href="/favicon.ico">


  <link rel="stylesheet" href="/shared/pico.min.css">
  <link rel="stylesheet" href="/shared/app.css?v=2">
  <link rel="stylesheet" href="./css/kalkulator.css">
  <script src="/shared/htmx.min.js"></script>
  <script src="/shared/pwa.js"></script>
  <script src="/shared/ui.js"></script>
</head>
<body>
  <div id="header-container" hx-get="/shared/header.html" hx-trigger="load" hx-swap="outerHTML"></div>

  <main class="container">
    <a href="./index.html" class="secondary" style="display: inline-flex; align-items: center; gap: 0.25rem; margin-bottom: 1.5rem; text-decoration: none;">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Kembali ke Dashboard
    </a>

    <div class="calc-title-bar">
      <h2>🔥 Kalkulator BMR &amp; Kalori Harian</h2>
      <div class="calc-actions">
        <button class="calc-action-btn secondary" id="bookmark-btn">⭐ Favorit</button>
      </div>
    </div>

    <div class="calc-container">
      <div class="calc-box">
        <form id="bmr-form" onsubmit="return false;">
          <div class="form-group">
            <label for="gender">Jenis Kelamin</label>
            <select id="gender">
              <option value="male">Laki-laki</option>
              <option value="female">Perempuan</option>
            </select>
          </div>
          <div class="form-group">
            <label for="age">Usia (Tahun)</label>
            <input type="number" id="age" value="25" min="15" max="100" required>
          </div>
          <div class="form-group">
            <label for="height">Tinggi Badan (cm)</label>
            <input type="number" id="height" value="170" min="100" max="250" required>
          </div>
          <div class="form-group">
            <label for="weight">Berat Badan (kg)</label>
            <input type="number" id="weight" value="65" min="30" max="200" required>
          </div>
          <div class="form-group">
            <label for="activity">Tingkat Aktivitas Harian</label>
            <select id="activity">
              <option value="sedentary">Sangat jarang olahraga (Sedentary)</option>
              <option value="light">Olahraga ringan 1-3 hari/minggu</option>
              <option value="moderate" selected>Olahraga sedang 3-5 hari/minggu</option>
              <option value="active">Olahraga berat 6-7 hari/minggu</option>
              <option value="very_active">Kerja fisik berat / atlet profesional</option>
            </select>
          </div>
          <button type="button" class="btn-navy" id="btn-calculate" style="width: 100%;">Hitung BMR &amp; TDEE</button>
        </form>
      </div>

      <div class="calc-box" style="display: flex; flex-direction: column; justify-content: center;">
        <div class="calc-result-box">
          <span class="calc-result-label">TDEE (Kalori Harian)</span>
          <div class="calc-result-value" id="tdee-val">- kcal</div>
          <span class="calc-result-badge badge-success" id="bmr-val">BMR: - kcal</span>
        </div>

        <div style="font-size: 0.95rem;">
          <strong>Target Kalori untuk Sasaran Tubuh Anda:</strong>
          <ul>
            <li>Menurunkan Berat Badan (Lambat): <strong id="lose-slow">-</strong> kcal</li>
            <li>Menurunkan Berat Badan (Cepat): <strong id="lose-fast">-</strong> kcal</li>
            <li>Menaikkan Berat Badan: <strong id="gain-val">-</strong> kcal</li>
          </ul>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container" hx-get="/shared/footer.html" hx-trigger="load" hx-swap="outerHTML"></div>
  <div id="toast-container" aria-live="polite"></div>

  <script type="module">
    import { toggleBookmark, getBookmarks, saveHistoryEntry } from './js/kalkulator-core.js';
    import { calculateBMR } from './js/health-calc.js';

    const slug = 'bmr-calorie';
    const calcName = 'Kalkulator BMR';

    document.addEventListener('DOMContentLoaded', () => {
      const bbtn = document.getElementById('bookmark-btn');
      if (getBookmarks().includes(slug)) bbtn.textContent = '⭐ Terfavorit';
      bbtn.addEventListener('click', () => {
        const isB = toggleBookmark(slug);
        bbtn.textContent = isB ? '⭐ Terfavorit' : '⭐ Favorit';
      });

      document.getElementById('btn-calculate').addEventListener('click', runCalculation);
    });

    function runCalculation() {
      const w = parseFloat(document.getElementById('weight').value);
      const h = parseFloat(document.getElementById('height').value);
      const age = parseInt(document.getElementById('age').value);
      const gender = document.getElementById('gender').value;
      const activity = document.getElementById('activity').value;

      if (!w || !h || !age) return;

      const res = calculateBMR(w, h, age, gender, activity);
      if (res) {
        document.getElementById('tdee-val').textContent = `${res.tdee} kcal`;
        document.getElementById('bmr-val').textContent = `BMR: ${res.bmr} kcal`;
        document.getElementById('lose-slow').textContent = res.loseWeightSlow;
        document.getElementById('lose-fast').textContent = res.loseWeightFast;
        document.getElementById('gain-val').textContent = res.gainWeight;

        saveHistoryEntry(slug, calcName, { w, h, age }, { value: `${res.tdee} kcal` });
      }
    }
  </script>
</body>
</html>
