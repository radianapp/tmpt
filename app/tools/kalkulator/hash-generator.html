<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hash Generator — TMPT</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg?v=2">
  <link rel="stylesheet" href="/shared/pico.min.css">
  <link rel="stylesheet" href="/shared/app.css?v=2">
  <link rel="stylesheet" href="./css/kalkulator.css">
  <script src="/shared/htmx.min.js"></script>
  <script src="/shared/pwa.js"></script>
  <script src="/shared/ui.js"></script>
</head>
<body>
  <div id="header-container" hx-get="/shared/header.html" hx-trigger="load" hx-swap="outerHTML"></div>

  <main class="container">
    <a href="./index.html" class="secondary" style="display: inline-flex; align-items: center; gap: 0.25rem; margin-bottom: 1.5rem; text-decoration: none;">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Kembali ke Dashboard
    </a>

    <div class="calc-title-bar">
      <h2>🔒 Hash Generator</h2>
      <div class="calc-actions">
        <button class="calc-action-btn secondary" id="bookmark-btn">⭐ Favorit</button>
      </div>
    </div>

    <div class="calc-container">
      <div class="calc-box">
        <label for="hash-input">Teks Asal</label>
        <textarea id="hash-input" placeholder="Masukkan teks untuk dihitung hash checksum..." style="min-height: 120px;"></textarea>
        <button class="btn-navy" id="btn-hash" style="width: 100%; margin-top: 1rem;">Generate Hash</button>
      </div>

      <div class="calc-box">
        <h3>Hasil Hash Checksum</h3>
        
        <div class="form-group">
          <label>MD5</label>
          <div style="display: flex; gap: 0.5rem;">
            <input type="text" id="out-md5" style="font-family: monospace;" readonly>
            <button class="calc-action-btn secondary btn-copy" data-target="out-md5">📋</button>
          </div>
        </div>

        <div class="form-group">
          <label>SHA-1</label>
          <div style="display: flex; gap: 0.5rem;">
            <input type="text" id="out-sha1" style="font-family: monospace;" readonly>
            <button class="calc-action-btn secondary btn-copy" data-target="out-sha1">📋</button>
          </div>
        </div>

        <div class="form-group">
          <label>SHA-256</label>
          <div style="display: flex; gap: 0.5rem;">
            <input type="text" id="out-sha256" style="font-family: monospace;" readonly>
            <button class="calc-action-btn secondary btn-copy" data-target="out-sha256">📋</button>
          </div>
        </div>

        <div class="form-group">
          <label>SHA-512</label>
          <div style="display: flex; gap: 0.5rem;">
            <input type="text" id="out-sha512" style="font-family: monospace;" readonly>
            <button class="calc-action-btn secondary btn-copy" data-target="out-sha512">📋</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container" hx-get="/shared/footer.html" hx-trigger="load" hx-swap="outerHTML"></div>
  <div id="toast-container" aria-live="polite"></div>

  <script type="module">
    import { toggleBookmark, getBookmarks, saveHistoryEntry } from './js/kalkulator-core.js';
    import { generateHashes } from './js/dev-calc.js';

    const slug = 'hash-generator';
    const calcName = 'Hash Generator';

    document.addEventListener('DOMContentLoaded', () => {
      const bbtn = document.getElementById('bookmark-btn');
      if (getBookmarks().includes(slug)) bbtn.textContent = '⭐ Terfavorit';
      bbtn.addEventListener('click', () => {
        const isB = toggleBookmark(slug);
        bbtn.textContent = isB ? '⭐ Terfavorit' : '⭐ Favorit';
      });

      document.getElementById('btn-hash').addEventListener('click', runHash);

      document.querySelectorAll('.btn-copy').forEach(btn => {
        btn.addEventListener('click', () => {
          const targetId = btn.getAttribute('data-target');
          const val = document.getElementById(targetId).value;
          if (!val) return;
          navigator.clipboard.writeText(val).then(() => {
            window.toast('Hash disalin!', 'success');
          });
        });
      });
    });

    async function runHash() {
      const input = document.getElementById('hash-input').value;
      const res = await generateHashes(input);
      
      document.getElementById('out-md5').value = res.md5;
      document.getElementById('out-sha1').value = res.sha1;
      document.getElementById('out-sha256').value = res.sha256;
      document.getElementById('out-sha512').value = res.sha512;

      saveHistoryEntry(slug, calcName, { length: input.length }, { value: res.sha256.substring(0, 8) + '...' });
    }
  </script>
</body>
</html>
