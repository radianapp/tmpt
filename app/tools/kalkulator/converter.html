<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Konverter Satuan &amp; Kurs — TMPT</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg?v=2">
  <link rel="stylesheet" href="/shared/pico.min.css">
  <link rel="stylesheet" href="/shared/app.css?v=2">
  <link rel="stylesheet" href="./css/kalkulator.css">
  <script src="/shared/htmx.min.js"></script>
  <script src="/shared/pwa.js"></script>
  <script src="/shared/ui.js"></script>
  <style>
    .conv-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }
    @media (min-width: 768px) {
      .conv-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="header-container" hx-get="/shared/header.html" hx-trigger="load" hx-swap="outerHTML"></div>

  <main class="container">
    <a href="./index.html" class="secondary" style="display: inline-flex; align-items: center; gap: 0.25rem; margin-bottom: 1.5rem; text-decoration: none;">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Kembali ke Dashboard
    </a>

    <div class="calc-title-bar">
      <h2>🔄 Konverter Satuan &amp; Kurs </h2>
      <div class="calc-actions">
        <button class="calc-action-btn secondary" id="bookmark-btn">⭐ Favorit</button>
      </div>
    </div>

    <div class="calc-box" style="margin-bottom: 1.5rem;">
      <label for="conv-category">Pilih Kategori Konversi</label>
      <select id="conv-category">
        <option value="currency" selected>Mata Uang (Currency)</option>
        <option value="volume">Volume</option>
        <option value="length">Panjang (Length)</option>
        <option value="weight">Berat &amp; Massa (Weight and mass)</option>
        <option value="temperature">Suhu (Temperature)</option>
        <option value="area">Luas (Area)</option>
        <option value="speed">Kecepatan (Speed)</option>
        <option value="time">Waktu (Time)</option>
        <option value="power">Daya (Power)</option>
        <option value="data">Data storage</option>
      </select>
    </div>

    <div style="text-align: center; margin-bottom: 1.5rem;">
      <button class="calc-action-btn secondary" id="btn-swap" style="width: auto; border-radius: 8px;">
        ⇄ Tukar Posisi (Dari ⇄ Ke)
      </button>
    </div>

    <div class="conv-grid">
      <!-- Input -->
      <div class="calc-box">
        <h3>Dari</h3>
        <div class="form-group">
          <label for="from-unit">Satuan Asal</label>
          <select id="from-unit"></select>
        </div>
        <div class="form-group">
          <label for="from-val">Nilai</label>
          <input type="number" id="from-val" value="1">
        </div>
      </div>

      <!-- Output -->
      <div class="calc-box">
        <h3>Ke</h3>
        <div class="form-group">
          <label for="to-unit">Satuan Tujuan</label>
          <select id="to-unit"></select>
        </div>
        <div class="calc-result-box" style="margin-top: 2rem;">
          <span class="calc-result-label">Hasil Konversi</span>
          <div class="calc-result-value" id="to-val">0</div>
        </div>
      </div>
    </div>

    <div id="currency-info-box" style="margin-top: 1.5rem; display: none; font-size: 0.85rem; text-align: center; color: var(--pico-muted-color);">
      <p style="margin-bottom: 0.25rem;">Sumber Data Kurs: <strong style="color: var(--calc-primary);">ExchangeRate-API (er-api.com)</strong></p>
      <p style="margin-bottom: 0.5rem;">Terakhir Diperbarui: <strong id="currency-last-update" style="color: var(--pico-heading-color);">-</strong></p>
      <button class="calc-action-btn secondary" id="btn-refresh-rates" style="width: auto; padding: 0.25rem 0.75rem !important; font-size: 0.8rem !important; margin: 0 auto; display: block;">
        🔄 Perbarui Kurs Sekarang
      </button>
    </div>
  </main>

  <div id="footer-container" hx-get="/shared/footer.html" hx-trigger="load" hx-swap="outerHTML"></div>
  <div id="toast-container" aria-live="polite"></div>

  <script type="module">
    import { toggleBookmark, getBookmarks, saveHistoryEntry } from './js/kalkulator-core.js';

    const slug = 'converter';
    const calcName = 'Konverter Satuan';

    const UNITS = {
      currency: {
        IDR: { name: 'Rupiah Indonesia (IDR)', rate: 16250 },
        USD: { name: 'Dolar AS (USD)', rate: 1 },
        EUR: { name: 'Euro (EUR)', rate: 0.92 },
        SGD: { name: 'Dolar Singapura (SGD)', rate: 1.35 },
        JPY: { name: 'Yen Jepang (JPY)', rate: 155 }
      },
      volume: {
        ml: { name: 'Mililiter (ml)', factor: 1000 },
        L: { name: 'Liter (L)', factor: 1 },
        m3: { name: 'Meter Kubik (m³)', factor: 0.001 },
        gallon: { name: 'Galon US (gal)', factor: 0.264172 }
      },
      length: {
        mm: { name: 'Milimeter (mm)', factor: 1000 },
        cm: { name: 'Sentimeter (cm)', factor: 100 },
        m: { name: 'Meter (m)', factor: 1 },
        km: { name: 'Kilometer (km)', factor: 0.001 },
        inch: { name: 'Inci (in)', factor: 39.3701 }
      },
      weight: {
        mg: { name: 'Miligram (mg)', factor: 1000000 },
        g: { name: 'Gram (g)', factor: 1000 },
        kg: { name: 'Kilogram (kg)', factor: 1 },
        lb: { name: 'Pound (lb)', factor: 2.20462 }
      },
      temperature: {
        C: { name: 'Celsius (°C)' },
        F: { name: 'Fahrenheit (°F)' },
        K: { name: 'Kelvin (K)' }
      },
      area: {
        m2: { name: 'Meter Persegi (m²)', factor: 1 },
        km2: { name: 'Kilometer Persegi (km²)', factor: 0.000001 },
        hectare: { name: 'Hektar (ha)', factor: 0.0001 },
        acre: { name: 'Acre (ac)', factor: 0.000247105 }
      },
      speed: {
        ms: { name: 'Meter per detik (m/s)', factor: 1 },
        kmh: { name: 'Kilometer per jam (km/h)', factor: 3.6 },
        mph: { name: 'Mil per jam (mph)', factor: 2.23694 }
      },
      time: {
        ms: { name: 'Milidetik (ms)', factor: 1000 },
        s: { name: 'Detik (s)', factor: 1 },
        min: { name: 'Menit (min)', factor: 1/60 },
        hr: { name: 'Jam (hr)', factor: 1/3600 },
        day: { name: 'Hari (day)', factor: 1/86400 }
      },
      power: {
        W: { name: 'Watt (W)', factor: 1 },
        kW: { name: 'Kilowatt (kW)', factor: 0.001 },
        hp: { name: 'Horsepower (hp)', factor: 0.00134102 }
      },
      data: {
        bit: { name: 'Bit (b)', factor: 8 },
        byte: { name: 'Byte (B)', factor: 1 },
        KB: { name: 'Kilobyte (KB)', factor: 1/1024 },
        MB: { name: 'Megabyte (MB)', factor: 1/(1024*1024) },
        GB: { name: 'Gigabyte (GB)', factor: 1/(1024*1024*1024) }
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      const bbtn = document.getElementById('bookmark-btn');
      if (getBookmarks().includes(slug)) bbtn.textContent = '⭐ Terfavorit';
      bbtn.addEventListener('click', () => {
        const isB = toggleBookmark(slug);
        bbtn.textContent = isB ? '⭐ Terfavorit' : '⭐ Favorit';
      });

      const catSelect = document.getElementById('conv-category');
      catSelect.addEventListener('change', () => {
        populateUnits();
        toggleCurrencyInfo();
      });
      
      document.getElementById('from-val').addEventListener('input', runConversion);
      document.getElementById('from-unit').addEventListener('change', runConversion);
      document.getElementById('to-unit').addEventListener('change', runConversion);

      // Swap button
      document.getElementById('btn-swap').addEventListener('click', () => {
        const fromUnit = document.getElementById('from-unit');
        const toUnit = document.getElementById('to-unit');
        
        const temp = fromUnit.value;
        fromUnit.value = toUnit.value;
        toUnit.value = temp;
        
        runConversion();
      });

      // Refresh rates button
      document.getElementById('btn-refresh-rates').addEventListener('click', () => {
        fetchLatestCurrencyRates(true);
      });

      populateUnits();
      toggleCurrencyInfo();
      fetchLatestCurrencyRates(false);
    });

    async function fetchLatestCurrencyRates(isManual = false) {
      const infoText = document.getElementById('currency-last-update');
      infoText.textContent = 'Memuat kurs terbaru...';
      
      try {
        const response = await fetch('https://open.er-api.com/v6/latest/USD');
        const data = await response.json();
        if (data && data.rates) {
          Object.keys(UNITS.currency).forEach(key => {
            if (data.rates[key]) {
              UNITS.currency[key].rate = data.rates[key];
            }
          });
          const updateTime = new Date(data.time_last_update_utc).toLocaleString('id-ID', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric' });
          infoText.textContent = `${updateTime} (UTC)`;
          localStorage.setItem('tmpt_currency_rates', JSON.stringify({
            rates: UNITS.currency,
            time: updateTime
          }));
          runConversion();
          if (isManual && window.toast) {
            window.toast('Kurs berhasil diperbarui secara langsung!', 'success');
          }
        }
      } catch (e) {
        console.warn('Gagal memuat kurs dinamis, menggunakan kurs statis.', e);
        const cached = localStorage.getItem('tmpt_currency_rates');
        if (cached) {
          const parsed = JSON.parse(cached);
          UNITS.currency = parsed.rates;
          infoText.textContent = parsed.time + ' (Tembolok)';
          runConversion();
          if (isManual && window.toast) {
            window.toast('Gagal terhubung. Menggunakan data kurs cache offline.', 'warning');
          }
        } else {
          infoText.textContent = 'Bawaan Statis (Offline)';
          if (isManual && window.toast) {
            window.toast('Gagal mengambil data baru. Sedang dalam mode offline murni.', 'error');
          }
        }
      }
    }

    function toggleCurrencyInfo() {
      const cat = document.getElementById('conv-category').value;
      const infoBox = document.getElementById('currency-info-box');
      if (cat === 'currency') {
        infoBox.style.display = 'block';
      } else {
        infoBox.style.display = 'none';
      }
    }

    function populateUnits() {
      const cat = document.getElementById('conv-category').value;
      const fromSel = document.getElementById('from-unit');
      const toSel = document.getElementById('to-unit');

      const options = Object.keys(UNITS[cat]).map(key => `
        <option value="${key}">${UNITS[cat][key].name}</option>
      `).join('');

      fromSel.innerHTML = options;
      toSel.innerHTML = options;

      // Select default different items
      if (toSel.options.length > 1) {
        toSel.selectedIndex = 1;
      }

      runConversion();
    }

    function runConversion() {
      const cat = document.getElementById('conv-category').value;
      const fromUnit = document.getElementById('from-unit').value;
      const toUnit = document.getElementById('to-unit').value;
      const val = parseFloat(document.getElementById('from-val').value);

      if (isNaN(val) || !fromUnit || !toUnit) {
        document.getElementById('to-val').textContent = '0';
        return;
      }

      let res = 0;
      if (cat === 'temperature') {
        res = convertTemp(val, fromUnit, toUnit);
      } else if (cat === 'currency') {
        const usdVal = val / UNITS.currency[fromUnit].rate;
        res = usdVal * UNITS.currency[toUnit].rate;
      } else {
        const baseVal = val / UNITS[cat][fromUnit].factor;
        res = baseVal * UNITS[cat][toUnit].factor;
      }

      document.getElementById('to-val').textContent = res.toLocaleString('id-ID', { maximumFractionDigits: 6 });
      saveHistoryEntry(slug, calcName, { cat, val, fromUnit, toUnit }, { value: res });
    }

    function convertTemp(v, from, to) {
      if (from === to) return v;
      let c = v;
      if (from === 'F') c = (v - 32) * 5/9;
      if (from === 'K') c = v - 273.15;

      if (to === 'C') return c;
      if (to === 'F') return (c * 9/5) + 32;
      if (to === 'K') return c + 273.15;
      return v;
    }
  </script>
</body>
</html>
