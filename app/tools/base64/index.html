<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 Encoder &amp; Decoder Online — TMPT Tools</title>
    <meta name="description" content="Encode dan decode Base64 gratis dan 100% private. 29 tools: teks, gambar, audio, video, PDF, HEX, Basic Auth, gzip check, validate, repair, dan lebih. Semua berjalan di browser — data tidak pernah dikirim ke server.">
    <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg?v=2">
    <link rel="stylesheet" href="/shared/pico.min.css">
    <link rel="stylesheet" href="/shared/app.css?v=2">
    <link rel="stylesheet" href="./base64.css">
    
    <script src="/shared/htmx.min.js"></script>
    <script src="/shared/pwa.js"></script>
    <script src="/shared/crypto.js"></script>
    <script src="/shared/vault.js"></script>
    <script src="/shared/auth.js"></script>
    <script src="/shared/ui.js"></script>
    <script src="/shared/version.js"></script>
    
    <!-- JSON-LD Structured Data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "TMPT Base64",
      "url": "https://tmpt.my.id/app/tools/base64/",
      "description": "Platform konversi Base64 all-in-one yang berjalan 100% di browser",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Any",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "IDR" },
      "featureList": [
        "Base64 Encoder & Decoder",
        "Image to Base64 / Data URI",
        "PDF to Base64",
        "Validate & Repair Base64",
        "Basic Auth Decoder",
        "Gzip Decompressor"
      ]
    }
    </script>
</head>
<body>
    <script>
        // Authentication Check
        (async () => {
            await window.TMPT_Auth.init();
            window.TMPT_Auth.requireAuth();
            if (window.TMPT_Auth.isUnlocked()) {
                window.TMPT_Auth.setupIdleListeners();
            }
        })();
    </script>

    <!-- Include TMPT shared app header -->
    <div id="header-container" hx-get="/shared/app-header.html" hx-trigger="load" hx-swap="outerHTML"></div>

    <main class="container">
        <div class="base64-layout">
            <!-- Sidebar Left -->
            <aside class="tool-sidebar">
                <div class="sidebar-search-box">
                    <input type="search" id="sidebar-search" placeholder="Cari perkakas..." style="margin-bottom:0; font-size:0.85rem; padding:0.4rem 0.75rem;">
                </div>
                <nav id="sidebar-tool-list">
                    <!-- Loaded dynamically by base64.js -->
                    <p class="secondary" style="font-size:0.85rem; text-align:center; padding:1rem;">Memuat daftar...</p>
                </nav>
            </aside>

            <!-- Main Workspace Right -->
            <div class="workbench-container" id="main-workbench">
                <!-- Loaded dynamically by base64.js -->
                <p class="secondary" style="text-align:center; padding:4rem;">Memuat antarmuka...</p>
            </div>
        </div>
    </main>

    <div id="footer-container" hx-get="/shared/footer.html" hx-trigger="load" hx-swap="outerHTML"></div>
    <div id="toast-container" aria-live="polite"></div>

    <!-- Dynamic SEO Tag -->
    <script type="module" src="/shared/seo.js" data-seo-key="tools-base64"></script>
    
    <!-- Script Modules -->
    <script type="module" src="./base64.js"></script>
</body>
</html>
