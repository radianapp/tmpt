    <script>
        (() => {
            const isUnlocked = (window.TMPT_Auth && window.TMPT_Auth.isUnlocked()) || sessionStorage.getItem('tmpt_is_unlocked') === 'true' || sessionStorage.getItem('tmpt_vault_key');
            if (isUnlocked) {
                const el = document.getElementById('app-footer');
                if (el) el.style.display = 'none';
            }
            if (window.TMPT_Version) {
                document.querySelectorAll('.tmpt-version').forEach(span => {
                    span.textContent = window.TMPT_Version;
                });
            }
        })();
