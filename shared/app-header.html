<!-- Vault Switcher Include -->
<div hx-get="/shared/vault-switcher.html?v=3" hx-trigger="load" hx-swap="outerHTML"></div>

<script>
    function handleSwitchVaultClick() {
        if (window.TMPT_License && window.TMPT_License.isPro()) {
            if (window.TMPT_OpenVaultSwitcher) window.TMPT_OpenVaultSwitcher();
        } else {
            showProUpgradeModal('Ganti Tmpt (Multi-Vault)');
        }
    }

    function showProUpgradeModal(featureName) {
        let modal = document.getElementById('pro-upgrade-modal');
        if (!modal) {
            modal = document.createElement('dialog');
            modal.id = 'pro-upgrade-modal';
            modal.innerHTML = `
                <article style="border-radius: 15px; padding: 2rem; max-width: 400px; text-align: center;">
                    <div style="font-size: 3rem; margin-bottom: 0.5rem; line-height: 1;">✨</div>
                    <h3 style="margin-bottom: 0.5rem;">Fitur Premium</h3>
                    <p class="secondary" style="margin-bottom: 1.5rem; line-height: 1.5;">Fitur <strong>${featureName}</strong> eksklusif untuk pengguna Edisi Pro. Tingkatkan akun Anda untuk mengelola banyak brankas secara bersamaan.</p>
                    <div class="grid" style="gap: 1rem;">
                        <button class="outline secondary" onclick="document.getElementById('pro-upgrade-modal').close()" style="margin-bottom: 0;">Nanti Saja</button>
                        <a href="/app/home/pro/" role="button" class="btn-navy" style="text-decoration: none; margin-bottom: 0;">Pelajari Pro</a>
                    </div>
                </article>
            `;
            document.body.appendChild(modal);
        }
        modal.showModal();
    }

    async function loadLicenseModule() {
        if (!window.TMPT_License) {
            await new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = '/shared/license.js';
                script.onload = resolve;
                document.head.appendChild(script);
            });
        }
    }

    async function loadFeedbackModule() {
        if (!window.TMPT_Feedback) {
            await new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = '/app/feedback/feedback-widget.js';
                script.defer = true;
                script.onload = resolve;
                document.head.appendChild(script);
            });
        }
    }

    async function loadScript(src) {
        return new Promise((resolve, reject) => {
            if (document.querySelector(`script[src="${src}"]`)) {
                resolve();
                return;
            }
            const script = document.createElement('script');
            script.src = src;
            script.onload = resolve;
            script.onerror = reject;
            document.head.appendChild(script);
        });
    }

    async function initTMPTAppHeader() {
        // Load i18n modules
        try {
            await loadScript('/shared/i18n-config.js');
            await loadScript('/shared/i18n.js');
            if (window.TMPT_I18n) {
                window.TMPT_I18n.applyTranslations();
            }
        } catch (e) {
            console.warn("Gagal memuat modul i18n di header:", e);
        }

        await loadLicenseModule();
        await loadFeedbackModule();
        const proBadge = document.getElementById('app-header-pro-badge');
        if (proBadge && window.TMPT_License && window.TMPT_License.isPro()) {
            proBadge.style.display = 'inline-block';
        }
        if (window.TMPT_UI) {
            window.TMPT_UI.updateThemeIcons(localStorage.getItem('tmpt_theme') || 'light');
            window.TMPT_UI.updateProfileUI();
        }

        // Muat modul TMPT Sync System secara dinamis
        try {
            // Core sync modules (urutan penting: dependencies dulu)
            await loadScript('/shared/sync/token-manager.js');
            await loadScript('/shared/sync/providers/base.js');
            await loadScript('/shared/sync/providers/gdrive.js');
            await loadScript('/shared/sync/snapshot-engine.js');
            await loadScript('/shared/sync/cloud-sync-engine.js');
            await loadScript('/shared/sync/conflict-resolver.js');
            await loadScript('/shared/sync/restore.js');
            await loadScript('/shared/sync/version-history.js');
            await loadScript('/shared/sync/sync-status.js');
            await loadScript('/shared/sync/sync-settings.js');

            // Inisialisasi Cloud Sync Engine dengan Google Drive provider
            if (window.TMPT_CloudSyncEngine && window.GDriveSyncProvider) {
                window.TMPT_CloudSyncEngine.init(new GDriveSyncProvider());
            }

            // Inisialisasi Sync Status Widget di header
            if (window.TMPT_SyncStatus) {
                window.TMPT_SyncStatus.init();
            }

            // Backward compat: tetap load backup-awareness & gdrive-sync lama
            await loadScript('/shared/backup-awareness.js');
            await loadScript('/shared/gdrive-sync.js');

            // Jalankan auto-backup lama jika sync baru belum aktif
            const isNewSyncConnected = window.TMPT_TokenManager?.isConnected();
            const isLegacyConnected  = localStorage.getItem('tmpt_gdrive_connected') === 'true';

            if (!isNewSyncConnected && isLegacyConnected && window.GDriveSync) {
                await window.GDriveSync.checkAndAutoBackup();
            }

            // Tampilkan reminder backup jika tidak ada sync aktif
            if (!isNewSyncConnected && !isLegacyConnected && window.BackupAwareness) {
                window.BackupAwareness.renderHeaderIcon();
                setTimeout(() => window.BackupAwareness.maybeShowReminder(), 2000);
            }

        } catch (e) {
            console.warn('Gagal memuat modul sync di header:', e);
            // Fallback: coba load backup-awareness saja
            try {
                await loadScript('/shared/backup-awareness.js');
                if (window.BackupAwareness) {
                    window.BackupAwareness.renderHeaderIcon();
                }
            } catch(e2) {}
        }

        // Setup menu mobile dinamis (sidebar / fallback modal)
        setupMobileMenu();
        // Setup mobile search handlers
        setupMobileSearch();
    }

    function setupMobileSearch() {
        const toggleSearchBtn = document.getElementById('header-mobile-search-toggle');
        const closeSearchBtn = document.getElementById('btn-close-mobile-search');
        const mainNav = document.getElementById('header-main-nav');
        const mobileSearch = document.getElementById('header-mobile-search-bar');
        const mobileSearchInput = document.getElementById('mobile-search-input');

        if (toggleSearchBtn && closeSearchBtn && mainNav && mobileSearch && mobileSearchInput) {
            toggleSearchBtn.onclick = (e) => {
                e.stopPropagation();
                mainNav.style.setProperty('display', 'none', 'important');
                mobileSearch.style.setProperty('display', 'flex', 'important');
                mobileSearchInput.focus();
            };

            closeSearchBtn.onclick = (e) => {
                e.stopPropagation();
                mobileSearch.style.setProperty('display', 'none', 'important');
                mainNav.style.setProperty('display', 'flex', 'important');
                mobileSearchInput.value = '';
                
                const headerSearch = document.getElementById('header-search');
                if (headerSearch) {
                    headerSearch.value = '';
                    headerSearch.dispatchEvent(new Event('input', { bubbles: true }));
                }
            };

            mobileSearchInput.addEventListener('input', (e) => {
                const headerSearch = document.getElementById('header-search');
                if (headerSearch) {
                    headerSearch.value = e.target.value;
                    headerSearch.dispatchEvent(new Event('input', { bubbles: true }));
                }
            });
        }
    }

    function setupMobileMenu() {
        const isMobile = window.innerWidth <= 768;
        if (!isMobile) return;

        // 1. Tambahkan menu ke sidebar jika ada di halaman aktif
        const sidebar = document.querySelector('.berkas-sidebar, .tugas-sidebar, .kalender-sidebar, #dashboard-sidebar, .sidebar, aside, nav.sidebar-nav');
        if (sidebar && !document.getElementById('mobile-sidebar-actions')) {
            const actionsDiv = document.createElement('div');
            actionsDiv.id = 'mobile-sidebar-actions';
            actionsDiv.style.cssText = 'padding: 1rem 0.5rem; margin-top: 1rem; border-top: 1px solid var(--pico-muted-border-color); display: flex; flex-direction: column; gap: 0.75rem;';
            
            actionsDiv.innerHTML = `
                <div style="font-size: 0.7rem; font-weight: 800; color: var(--pico-muted-color); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem;">Aktivitas TMPT</div>
                <a href="/app/" class="secondary" style="display: flex; align-items: center; gap: 0.5rem; text-decoration: none; font-size: 0.85rem; font-weight: 600;">
                    <span>🏠</span> Dashboard Utama
                </a>
                <a href="#" onclick="event.preventDefault(); window.TMPT_UI.toggleAppLauncher(this, event);" class="secondary" style="display: flex; align-items: center; gap: 0.5rem; text-decoration: none; font-size: 0.85rem; font-weight: 600;">
                    <span>📱</span> Aplikasi TMPT
                </a>
                <a href="/app/auth/settings/" class="secondary" style="display: flex; align-items: center; gap: 0.5rem; text-decoration: none; font-size: 0.85rem; font-weight: 600;">
                    <span>⚙️</span> Setelan Pengaturan
                </a>
                <a href="#" onclick="event.preventDefault(); window.TMPT_UI.toggleTheme();" class="secondary" style="display: flex; align-items: center; gap: 0.5rem; text-decoration: none; font-size: 0.85rem; font-weight: 600;">
                    <span>🌓</span> Ganti Tema
                </a>
                <a href="#" onclick="event.preventDefault(); window.TMPT_Feedback.toggleWidget();" class="secondary" style="display: flex; align-items: center; gap: 0.5rem; text-decoration: none; font-size: 0.85rem; font-weight: 600;">
                    <span>❓</span> Bantuan & Umpan Balik
                </a>
            `;
            sidebar.appendChild(actionsDiv);
        }
        
        // 2. Listener global untuk hamburger menu di halaman tanpa sidebar
        document.addEventListener('click', (e) => {
            const toggleBtn = e.target.closest('#header-sidebar-toggle');
            if (toggleBtn) {
                const hasSidebar = document.querySelector('.berkas-sidebar, .tugas-sidebar, .kalender-sidebar, #dashboard-sidebar, .sidebar, aside');
                if (!hasSidebar) {
                    const modal = document.getElementById('mobile-app-nav-modal');
                    if (modal) {
                        modal.showModal();
                    }
                }
            }
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initTMPTAppHeader);
    } else {
        initTMPTAppHeader();
    }
</script>
