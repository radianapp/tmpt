<header class="container">

                            <rect x="4" y="10" width="4" height="4" rx="1"></rect>
                            <rect x="10" y="10" width="4" height="4" rx="1"></rect>
                            <rect x="16" y="10" width="4" height="4" rx="1"></rect>
                            <rect x="4" y="16" width="4" height="4" rx="1"></rect>
                            <rect x="10" y="16" width="4" height="4" rx="1"></rect>

                        <h4 style="font-size: 0.95rem; font-weight: 700; margin-top: 0; margin-bottom: 1rem; border-bottom: 1px solid var(--pico-muted-border-color); padding-bottom: 0.5rem; color: var(--pico-color);">Aplikasi TMPT</h4>
                        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; text-align: center;">
                            <a href="/app/" class="app-launcher-item" style="display: flex; flex-direction: column; align-items: center; gap: 0.35rem; text-decoration: none; color: var(--pico-color); font-size: 0.75rem; font-weight: 600; padding: 0.5rem 0; border-radius: 12px; transition: background-color 0.2s;">

                            </a>

                                <span style="font-size: 1.5rem;">🔐</span>
                                <span style="display: block; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;">Brankas</span>
                            </a>

                                <span style="font-size: 1.5rem;">📝</span>

                        <div style="display: flex; justify-content: center; margin-bottom: 1rem;">

<!-- Mobile App Menu Dialog -->
<dialog id="mobile-app-nav-modal">
    <article style="border-radius: 20px; padding: 1.5rem 2rem;">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid var(--pico-muted-border-color); padding-bottom: 1rem;">
            <strong style="font-size: 1.25rem;">Menu TMPT</strong>
            <button class="close" aria-label="Tutup" onclick="document.getElementById('mobile-app-nav-modal').close()" style="margin-bottom: 0; background: transparent; border: none; font-size: 1.5rem; color: var(--pico-secondary); padding: 0; width: auto; height: auto;">✕</button>
        </header>
        <ul style="list-style: none !important; padding-left: 0 !important; margin: 0;">
            <li style="margin: 1.25rem 0; list-style: none !important;"><a href="/app/" class="secondary" onclick="document.getElementById('mobile-app-nav-modal').close()" style="font-weight: 600;">Dashboard</a></li>
            <li style="margin: 1.25rem 0; list-style: none !important;"><a href="/app/tools/" class="secondary" onclick="document.getElementById('mobile-app-nav-modal').close()" style="font-weight: 600;">Tools &amp; Generator</a></li>
            <li style="margin: 1.25rem 0; list-style: none !important;"><a href="/app/auth/settings/" class="secondary" onclick="document.getElementById('mobile-app-nav-modal').close()" style="font-weight: 600;">Pengaturan</a></li>
            <li style="margin-top: 2rem; list-style: none !important;">
                <button role="button" class="outline secondary" style="width: 100%; text-align: center; display: block; border-radius: 10px; font-weight: 600;" onclick="document.getElementById('mobile-app-nav-modal').close(); window.TMPT_Auth.lock();">Kunci Tmpt</button>
            </li>
        </ul>
    </article>
</dialog>

<!-- Vault Switcher Include -->
<div hx-get="/shared/vault-switcher.html?v=3" hx-trigger="load" hx-swap="outerHTML"></div>

<script>
    function handleSwitchVaultClick() {
        if (window.TMPT_License && window.TMPT_License.isPro()) {
            if (window.TMPT_OpenVaultSwitcher) window.TMPT_OpenVaultSwitcher();
        } else {
            showProUpgradeModal('Ganti Tmpt (Multi-Vault)');
        }
    }

    function showProUpgradeModal(featureName) {
        let modal = document.getElementById('pro-upgrade-modal');
        if (!modal) {
            modal = document.createElement('dialog');
            modal.id = 'pro-upgrade-modal';
            modal.innerHTML = `
                <article style="border-radius: 15px; padding: 2rem; max-width: 400px; text-align: center;">
                    <div style="font-size: 3rem; margin-bottom: 0.5rem; line-height: 1;">✨</div>
                    <h3 style="margin-bottom: 0.5rem;">Fitur Premium</h3>
                    <p class="secondary" style="margin-bottom: 1.5rem; line-height: 1.5;">Fitur <strong>${featureName}</strong> eksklusif untuk pengguna Edisi Pro. Tingkatkan akun Anda untuk mengelola banyak brankas secara bersamaan.</p>
                    <div class="grid" style="gap: 1rem;">
                        <button class="outline secondary" onclick="document.getElementById('pro-upgrade-modal').close()" style="margin-bottom: 0;">Nanti Saja</button>
                        <a href="/app/home/pro/" role="button" class="btn-navy" style="text-decoration: none; margin-bottom: 0;">Pelajari Pro</a>
                    </div>
                </article>
            `;
            document.body.appendChild(modal);
        }
        modal.showModal();
    }

    async function loadLicenseModule() {
        if (!window.TMPT_License) {
            await new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = '/shared/license.js';
                script.onload = resolve;
                document.head.appendChild(script);
            });
        }
    }

    async function loadFeedbackModule() {
        if (!window.TMPT_Feedback) {
            await new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = '/app/feedback/feedback-widget.js';
                script.defer = true;
                script.onload = resolve;
                document.head.appendChild(script);
            });
        }
    }

    async function initTMPTAppHeader() {
        await loadLicenseModule();
        await loadFeedbackModule();
        const proBadge = document.getElementById('app-header-pro-badge');
        if (proBadge && window.TMPT_License && window.TMPT_License.isPro()) {
            proBadge.style.display = 'inline-block';
        }
        if (window.TMPT_UI) {
            window.TMPT_UI.updateThemeIcons(localStorage.getItem('tmpt_theme') || 'light');
            window.TMPT_UI.updateProfileUI();
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initTMPTAppHeader);
    } else {
        initTMPTAppHeader();
    }
</script>
