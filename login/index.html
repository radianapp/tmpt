<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg?v=2">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/assets/css/app.css">
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    <script src="/assets/js/pwa.js"></script>
    <script src="/assets/js/crypto.js"></script>
    <script src="/assets/js/vault.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/ui.js"></script>
    <script src="/assets/js/backup.js"></script>
</head>
<body>

    <div id="header-container" hx-get="/shared/header.html" hx-trigger="load" hx-swap="outerHTML"></div>

    <main class="container">
        <article class="auth-card">
            <header>
                <h2 class="text-center">Buka Brankas</h2>
                <p class="text-center secondary">Masukkan master password Anda untuk mengakses data.</p>
            </header>

            <div id="no-vault-message" style="display: none;">
                <p class="text-center">Brankas tidak ditemukan di browser ini.</p>
                <div class="grid">
                    <a href="/setup" role="button" class="contrast">Buat Baru</a>
                    <button class="outline" onclick="document.getElementById('import-file-login').click()">📥 Import (.tmpt)</button>
                </div>
            </div>

            <input type="file" id="import-file-login" accept=".tmpt" style="display: none;" onchange="handleLoginImport(event)">

            <form id="login-form">
                <label for="password">Master Password</label>
                <div class="pwd-input-row">
                    <input type="password" id="password" name="password" required>
                    <button type="button" class="outline secondary" onclick="toggleLoginVisibility('password', this)" title="Tampilkan/Sembunyikan">👁️</button>
                </div>

                <div id="hint-container" style="display: none; margin-bottom: 1rem;">
                    <details>
                        <summary>Lupa password? Lihat hint</summary>
                        <p id="password-hint" class="secondary" style="font-style: italic;"></p>
                    </details>
                </div>

                <button type="submit" id="submit-btn">Buka Sekarang</button>
            </form>

            <footer class="text-center">
                <p id="footer-no-vault" style="display: none;">Punya file backup (.tmpt)? <a href="#" onclick="document.getElementById('import-file-login').click(); return false;">Import Brankas</a></p>
                <p id="footer-has-vault" style="display: none;">Ingin restore data lama? <a href="#" onclick="document.getElementById('import-file-login').click(); return false;">Import File (.tmpt)</a></p>
            </footer>
        </article>
    </main>

    <div id="footer-container" hx-get="/shared/footer.html" hx-trigger="load" hx-swap="outerHTML"></div>

    <!-- Modal Konfirmasi -->
    <dialog id="confirm-modal">
        <article>
            <h3 id="confirm-title">Konfirmasi</h3>
            <p id="confirm-message">Apakah Anda yakin?</p>
            <div id="confirm-input-container" style="display: none; margin-top: 1rem;">
                <input type="text" id="confirm-input" placeholder="Ketik kalimat konfirmasi di sini" autocomplete="off">
            </div>
            <footer>
                <div class="grid">
                    <button class="secondary outline" onclick="closeConfirm(false)">Batal</button>
                    <button class="contrast" id="confirm-ok-btn" onclick="closeConfirm(true)">Lanjutkan</button>
                </div>
            </footer>
        </article>
    </dialog>

    <script>
        // Modal helpers
        function closeConfirm(val) {
            const modal = document.getElementById('confirm-modal');
            if (modal._resolve) modal._resolve(val);
            modal.close();
        }

        async function handleLoginImport(e) {
            const file = e.target.files[0];
            if (!file) return;
            try {
                const success = await window.TMPT_Backup.importVault(file);
                if (success) {
                    window.location.reload();
                }
            } catch (err) {
                console.error(err);
            }
            e.target.value = '';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await window.TMPT_Auth.init();
            
            const vaultExists = window.TMPT_Vault.exists();
            if (!vaultExists) {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('no-vault-message').style.display = 'block';
                document.getElementById('footer-no-vault').style.display = 'block';
            } else {
                document.getElementById('footer-has-vault').style.display = 'block';
                const meta = window.TMPT_Vault.getMetadata();
                if (meta && meta.hint) {
                    document.getElementById('hint-container').style.display = 'block';
                    document.getElementById('password-hint').textContent = meta.hint;
                }
            }
        });

        function toggleLoginVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                btn.style.opacity = "0.5";
            } else {
                input.type = "password";
                btn.style.opacity = "1";
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;

            window.TMPT_UI.setLoading('#submit-btn', true);

            try {
                const success = await window.TMPT_Auth.unlock(password);
                if (success) {
                    window.TMPT_UI.toast("Brankas terbuka!", "success");
                    setTimeout(() => {
                        window.location.href = '/brankas';
                    }, 500);
                }
            } catch (err) {
                console.error(err);
                window.TMPT_UI.toast(err.message || "Gagal membuka Brankas.", "error");
            } finally {
                window.TMPT_UI.setLoading('#submit-btn', false);
            }
        });
    </script>
</body>
</html>
