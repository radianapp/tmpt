<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg?v=2">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/assets/css/app.css">
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    <script src="/assets/js/pwa.js"></script>
    <script src="/assets/js/crypto.js"></script>
    <script src="/assets/js/vault.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/ui.js"></script>
    <script src="/assets/js/backup.js"></script>
</head>
<body>

    <div id="header-container" hx-get="/shared/header.html" hx-trigger="load" hx-swap="outerHTML"></div>

    <main class="container">
        <article class="setup-card">
            <header class="text-center" style="border-bottom: none; margin-bottom: 0.5rem; padding-bottom: 0;">
                <div class="setup-icon-box">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                        <rect x="3" y="3" width="18" height="18" rx="2" />
                        <circle cx="12" cy="12" r="3" />
                        <path d="M12 15v2" />
                        <path d="M15 12h2" />
                        <path d="M7 12h2" />
                        <path d="M12 7v2" />
                    </svg>
                </div>
                <h1 style="margin-bottom: 0.25rem;">Buka Brankas</h1>
                <p class="secondary" style="margin-bottom: 1.5rem;">Masukkan master password Anda untuk mengakses data.</p>
            </header>

            <div id="no-vault-message" style="display: none; margin-bottom: 2rem; text-align: center;">
                <p style="color: var(--pico-secondary); font-size: 1rem; margin-bottom: 1.5rem;">Brankas tidak ditemukan di browser ini</p>
                <div class="grid" style="gap: 1rem;">
                    <a href="/setup" role="button" class="btn-generate" style="margin-bottom: 0;">Buat Baru</a>
                    <button class="outline" onclick="document.getElementById('import-file-login').click()" style="margin-bottom: 0; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; border-color: var(--pico-muted-border-color); color: var(--pico-primary);">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" /><path d="M7 9l5 -5l5 5" /><path d="M12 4l0 12" /></svg>
                        Import (.tmpt)
                    </button>
                </div>
            </div>

            <input type="file" id="import-file-login" accept=".tmpt" style="display: none;" onchange="handleLoginImport(event)">

            <form id="login-form">
                <div style="margin-bottom: 1.5rem;">
                    <label for="password" style="font-weight: 600; margin-bottom: 0.5rem; display: block; text-align: left;">Master Password</label>
                    <div class="pwd-input-group">
                        <input type="password" id="password" name="password" required placeholder="Masukkan sandi master">
                        <button type="button" class="btn-toggle-eye" onclick="toggleLoginVisibility('password', this)" title="Tampilkan/Sembunyikan">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6" /></svg>
                        </button>
                    </div>
                </div>

                <div id="hint-container" style="display: none; margin-bottom: 1.5rem; text-align: left;">
                    <details>
                        <summary style="font-weight: 500; color: var(--pico-secondary); cursor: pointer;">💡 Lupa password? Lihat hint</summary>
                        <div style="padding: 0.75rem 1rem; background: var(--pico-background-color); border-radius: 8px; border: 1px solid var(--pico-muted-border-color); margin-top: 0.5rem;">
                            <p id="password-hint" style="font-style: italic; margin: 0; color: var(--pico-h1-color);"></p>
                        </div>
                    </details>
                </div>

                <button type="submit" id="submit-btn" class="btn-generate" style="width: 100%; margin-bottom: 1.5rem;">Buka Brankas Sekarang</button>
            </form>

        </article>
    </main>

    <div id="footer-container" hx-get="/shared/footer.html" hx-trigger="load" hx-swap="outerHTML"></div>

    <!-- Modal Konfirmasi -->
    <dialog id="confirm-modal">
        <article>
            <h3 id="confirm-title">Konfirmasi</h3>
            <p id="confirm-message">Apakah Anda yakin?</p>
            <div id="confirm-input-container" style="display: none; margin-top: 1rem;">
                <input type="text" id="confirm-input" placeholder="Ketik kalimat konfirmasi di sini" autocomplete="off">
            </div>
            <footer>
                <div class="grid" style="gap: 1rem;">
                    <button class="btn-gray" onclick="closeConfirm(false)">Batal</button>
                    <button class="btn-navy" id="confirm-ok-btn" onclick="closeConfirm(true)">Lanjutkan</button>
                </div>
            </footer>
        </article>
    </dialog>

    <script>
        // Modal helpers
        function closeConfirm(val) {
            const modal = document.getElementById('confirm-modal');
            if (modal._resolve) modal._resolve(val);
            modal.close();
        }

        async function handleLoginImport(e) {
            const file = e.target.files[0];
            if (!file) return;
            try {
                const success = await window.TMPT_Backup.importVault(file);
                if (success) {
                    window.location.reload();
                }
            } catch (err) {
                console.error(err);
            }
            e.target.value = '';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await window.TMPT_Auth.init();
            
            const vaultExists = window.TMPT_Vault.exists();
            if (!vaultExists) {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('no-vault-message').style.display = 'block';
            } else {
                const meta = window.TMPT_Vault.getMetadata();
                if (meta) {
                    document.getElementById('hint-container').style.display = 'block';
                    const hintEl = document.getElementById('password-hint');
                    if (meta.hint) {
                        hintEl.textContent = meta.hint;
                    } else {
                        hintEl.textContent = "Tidak ada petunjuk sandi yang diatur saat pembuatan brankas ini.";
                        hintEl.style.color = "var(--pico-secondary)";
                    }
                }
            }
        });

        function toggleLoginVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                btn.style.opacity = "0.5";
            } else {
                input.type = "password";
                btn.style.opacity = "1";
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;

            window.TMPT_UI.setLoading('#submit-btn', true);

            try {
                const success = await window.TMPT_Auth.unlock(password);
                if (success) {
                    window.TMPT_UI.toast("Brankas terbuka!", "success");
                    setTimeout(() => {
                        window.location.href = '/brankas';
                    }, 500);
                }
            } catch (err) {
                console.error(err);
                window.TMPT_UI.toast(err.message || "Gagal membuka Brankas.", "error");
            } finally {
                window.TMPT_UI.setLoading('#submit-btn', false);
            }
        });
    </script>
</body>
</html>
