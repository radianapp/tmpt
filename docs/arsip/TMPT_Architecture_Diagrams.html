<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMPT — Architecture Diagrams</title>
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --border: rgba(0,0,0,0.1);
    --text: #1a1a18;
    --muted: #6b6b67;
    --blue-50:#E6F1FB;--blue-100:#B5D4F4;--blue-200:#85B7EB;--blue-400:#378ADD;--blue-600:#185FA5;--blue-800:#0C447C;--blue-900:#042C53;
    --teal-50:#E1F5EE;--teal-100:#9FE1CB;--teal-400:#1D9E75;--teal-600:#0F6E56;--teal-800:#085041;--teal-900:#04342C;
    --purple-50:#EEEDFE;--purple-100:#CECBF6;--purple-400:#7F77DD;--purple-600:#534AB7;--purple-800:#3C3489;--purple-900:#26215C;
    --coral-50:#FAECE7;--coral-100:#F5C4B3;--coral-400:#D85A30;--coral-600:#993C1D;--coral-800:#712B13;--coral-900:#4A1B0C;
    --gray-50:#F1EFE8;--gray-100:#D3D1C7;--gray-400:#888780;--gray-600:#5F5E5A;--gray-800:#444441;--gray-900:#2C2C2A;
    --green-50:#EAF3DE;--green-100:#C0DD97;--green-400:#639922;--green-600:#3B6D11;--green-800:#27500A;
    --amber-50:#FAEEDA;--amber-100:#FAC775;--amber-400:#BA7517;--amber-600:#854F0B;--amber-800:#633806;
  }
  @media(prefers-color-scheme:dark){
    :root{
      --bg:#1e1e1c;--surface:#2a2a28;--border:rgba(255,255,255,0.1);--text:#e8e6de;--muted:#9c9a92;
      --blue-50:#042C53;--blue-800:#B5D4F4;--blue-900:#E6F1FB;
      --teal-50:#04342C;--teal-800:#9FE1CB;--teal-900:#E1F5EE;
      --purple-50:#26215C;--purple-800:#CECBF6;--purple-900:#EEEDFE;
      --coral-50:#4A1B0C;--coral-800:#F5C4B3;--coral-900:#FAECE7;
      --gray-50:#2C2C2A;--gray-800:#D3D1C7;--gray-900:#F1EFE8;
      --green-50:#173404;--green-800:#C0DD97;
      --amber-50:#412402;--amber-800:#FAC775;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.6;padding:32px 24px}
  h1{font-size:22px;font-weight:500;margin-bottom:6px}
  .subtitle{color:var(--muted);font-size:13px;margin-bottom:40px}
  .section{margin-bottom:48px}
  .section-title{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;overflow:hidden}

  /* SVG base styles */
  svg text{font-family:inherit}
  .th{font-size:14px;font-weight:500;fill:var(--text)}
  .ts{font-size:12px;fill:var(--muted)}

  /* Color classes */
  .c-blue rect,.c-blue circle{fill:var(--blue-50);stroke:var(--blue-400)}
  .c-blue .th{fill:var(--blue-800)} .c-blue .ts{fill:var(--blue-600)}
  .c-teal rect,.c-teal circle{fill:var(--teal-50);stroke:var(--teal-400)}
  .c-teal .th{fill:var(--teal-800)} .c-teal .ts{fill:var(--teal-600)}
  .c-purple rect,.c-purple circle{fill:var(--purple-50);stroke:var(--purple-400)}
  .c-purple .th{fill:var(--purple-800)} .c-purple .ts{fill:var(--purple-600)}
  .c-coral rect,.c-coral circle{fill:var(--coral-50);stroke:var(--coral-400)}
  .c-coral .th{fill:var(--coral-800)} .c-coral .ts{fill:var(--coral-600)}
  .c-gray rect,.c-gray circle{fill:var(--gray-50);stroke:var(--gray-400)}
  .c-gray .th{fill:var(--gray-800)} .c-gray .ts{fill:var(--gray-600)}
  .c-green rect,.c-green circle{fill:var(--green-50);stroke:var(--green-400)}
  .c-green .th{fill:var(--green-800)} .c-green .ts{fill:var(--green-600)}
  .c-amber rect,.c-amber circle{fill:var(--amber-50);stroke:var(--amber-400)}
  .c-amber .th{fill:var(--amber-800)} .c-amber .ts{fill:var(--amber-600)}

  /* Arrows and connectors */
  .arr{stroke:var(--gray-400);stroke-width:1.2;fill:none}
  .leader{stroke:var(--gray-400);stroke-width:0.5;stroke-dasharray:3 3;fill:none}

  /* Outer frame */
  .frame{fill:var(--gray-50);stroke:var(--border)}

  @media(prefers-color-scheme:dark){
    .c-blue rect{fill:var(--blue-50);stroke:var(--blue-200)}
    .c-blue .th{fill:var(--blue-800)} .c-blue .ts{fill:var(--blue-200)}
    .c-teal rect{fill:var(--teal-50);stroke:var(--teal-100)}
    .c-teal .th{fill:var(--teal-800)} .c-teal .ts{fill:var(--teal-100)}
    .c-purple rect{fill:var(--purple-50);stroke:var(--purple-100)}
    .c-purple .th{fill:var(--purple-800)} .c-purple .ts{fill:var(--purple-100)}
    .c-coral rect{fill:var(--coral-50);stroke:var(--coral-100)}
    .c-coral .th{fill:var(--coral-800)} .c-coral .ts{fill:var(--coral-100)}
    .c-gray rect{fill:var(--gray-50);stroke:var(--gray-100)}
    .c-gray .th{fill:var(--gray-800)} .c-gray .ts{fill:var(--gray-100)}
    .c-green rect{fill:var(--green-50);stroke:var(--green-100)}
    .c-green .th{fill:var(--green-800)} .c-green .ts{fill:var(--green-100)}
    .frame{fill:var(--surface);stroke:var(--border)}
    .arr{stroke:var(--gray-400)}
  }
</style>
</head>
<body>

<h1>TMPT — Architecture Diagrams</h1>
<p class="subtitle">tmpt.my.id · PicoCSS + HTMX + Vanilla JS · GitHub Pages</p>

<!-- ═══════════════════════════════════════════════════ -->
<!-- DIAGRAM 1: SITEMAP                                  -->

<line x1="52" y1="58" x2="628" y2="58" stroke="var(--border)" stroke-width="0.5"/>

  <text class="ts" x="118" y="181" text-anchor="middle" dominant-baseline="central">Contact</text>
  <text class="ts" x="118" y="199" text-anchor="middle" dominant-baseline="central">Terms &amp; privacy</text>
</g>

<!-- Auth (teal) -->
<g class="c-teal">
  <rect x="201" y="68" width="133" height="190" rx="8" stroke-width="0.5"/>
  <text class="th" x="267" y="88" text-anchor="middle" dominant-baseline="central">Auth</text>
  <text class="ts" x="267" y="109" text-anchor="middle" dominant-baseline="central">Buat vault baru</text>
  <text class="ts" x="267" y="127" text-anchor="middle" dominant-baseline="central">Buka vault (login)</text>
  <text class="ts" x="267" y="154" text-anchor="middle" dominant-baseline="central" style="opacity:.55">— tanpa reset pwd —</text>
</g>

<!-- Platform (purple) -->
<g class="c-purple">
  <rect x="350" y="68" width="133" height="190" rx="8" stroke-width="0.5"/>
  <text class="th" x="416" y="88" text-anchor="middle" dominant-baseline="central">Platform</text>
  <text class="ts" x="416" y="109" text-anchor="middle" dominant-baseline="central">Dashboard TMPT</text>
  <text class="ts" x="416" y="127" text-anchor="middle" dominant-baseline="central">Global settings</text>
  <text class="ts" x="416" y="145" text-anchor="middle" dominant-baseline="central">Backup &amp; restore</text>
</g>

<!-- BRANKAS (coral) -->
<g class="c-coral">
  <rect x="499" y="68" width="133" height="190" rx="8" stroke-width="0.5"/>
  <text class="th" x="565" y="88" text-anchor="middle" dominant-baseline="central">BRANKAS</text>
  <text class="ts" x="565" y="109" text-anchor="middle" dominant-baseline="central">Dashboard</text>
  <text class="ts" x="565" y="127" text-anchor="middle" dominant-baseline="central">Credentials</text>
  <text class="ts" x="565" y="145" text-anchor="middle" dominant-baseline="central">Info penting</text>
  <text class="ts" x="565" y="163" text-anchor="middle" dominant-baseline="central">Settings</text>
  <text class="ts" x="565" y="181" text-anchor="middle" dominant-baseline="central">Backup per-app</text>
</g>
</svg>
</div>
</div>

<!-- ═══════════════════════════════════════════════════ -->
<!-- DIAGRAM 2: AUTH FLOW                               -->
<!-- ═══════════════════════════════════════════════════ -->
<div class="section">
<div class="section-title">2 — Auth flow: buat vault vs buka vault</div>
<div class="card">
<svg width="100%" viewBox="0 0 680 456" role="img" aria-label="Auth flow TMPT">
<defs>
  <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Node 1: Visit -->
<g class="c-gray">
  <rect x="240" y="28" width="200" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="50" text-anchor="middle" dominant-baseline="central">Kunjungi tmpt.my.id</text>
</g>
<line x1="340" y1="72" x2="340" y2="112" class="arr" marker-end="url(#arr2)"/>

<!-- Node 2: Vault check -->
<g class="c-gray">
  <rect x="200" y="112" width="280" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="134" text-anchor="middle" dominant-baseline="central">Vault sudah ada di browser ini?</text>

<path d="M200 134 L132 134 L132 208" class="arr" fill="none" marker-end="url(#arr2)"/>

<!-- Right branch arrow + label -->
<path d="M480 134 L548 134 L548 208" class="arr" fill="none" marker-end="url(#arr2)"/>
<text class="ts" x="518" y="127" text-anchor="middle" dominant-baseline="central">vault baru</text>

<!-- ── Left branch: Login ── -->
<text class="ts" x="132" y="195" text-anchor="middle" dominant-baseline="central" style="opacity:.6">pengguna lama</text>

<g class="c-teal">
  <rect x="42" y="208" width="180" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="132" y="228" text-anchor="middle" dominant-baseline="central">Buka vault</text>
  <text class="ts" x="132" y="248" text-anchor="middle" dominant-baseline="central">Input master password</text>
</g>
<line x1="132" y1="264" x2="132" y2="300" class="arr" marker-end="url(#arr2)"/>

<g class="c-teal">
  <rect x="42" y="300" width="180" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="132" y="320" text-anchor="middle" dominant-baseline="central">Verifikasi PBKDF2</text>

</g>
<path d="M132 356 L132 412 L240 412" class="arr" fill="none" marker-end="url(#arr2)"/>

<!-- ── Right branch: Setup ── -->
<text class="ts" x="548" y="195" text-anchor="middle" dominant-baseline="central" style="opacity:.6">pengguna baru</text>

<g class="c-purple">
  <rect x="458" y="208" width="180" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="548" y="228" text-anchor="middle" dominant-baseline="central">Buat vault baru</text>
  <text class="ts" x="548" y="248" text-anchor="middle" dominant-baseline="central">Password + hint opsional</text>
</g>
<line x1="548" y1="264" x2="548" y2="300" class="arr" marker-end="url(#arr2)"/>

</g>
</svg>
</div>
</div>

<!-- ═══════════════════════════════════════════════════ -->
<!-- DIAGRAM 3: BACKUP & RESTORE                        -->
<!-- ═══════════════════════════════════════════════════ -->
<div class="section">
<div class="section-title">3 — Backup &amp; restore flow</div>
<div class="card">
<svg width="100%" viewBox="0 0 680 508" role="img" aria-label="Backup dan restore flow TMPT">
<defs>
  <marker id="arr3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Divider -->
<line x1="340" y1="10" x2="340" y2="498" class="leader"/>

<!-- Column headers -->
<text class="th" x="170" y="22" text-anchor="middle" dominant-baseline="central">Export / Backup</text>
<text class="th" x="510" y="22" text-anchor="middle" dominant-baseline="central">Import / Restore</text>

<!-- ── LEFT: EXPORT ── -->
<!-- 1. Start backup -->
<g class="c-teal">
  <rect x="70" y="40" width="200" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="170" y="62" text-anchor="middle" dominant-baseline="central">Mulai backup</text>
</g>
<line x1="170" y1="84" x2="170" y2="116" class="arr" marker-end="url(#arr3)"/>

<!-- 2. Pilih level -->
<g class="c-gray">
  <rect x="70" y="116" width="200" height="72" rx="8" stroke-width="0.5"/>
  <text class="th" x="170" y="136" text-anchor="middle" dominant-baseline="central">Pilih level backup</text>
  <text class="ts" x="170" y="156" text-anchor="middle" dominant-baseline="central">● Full TMPT → .tmpt</text>
  <text class="ts" x="170" y="174" text-anchor="middle" dominant-baseline="central">● Per-app → .brankas</text>
</g>
<line x1="170" y1="188" x2="170" y2="220" class="arr" marker-end="url(#arr3)"/>

<!-- 3. Pilih tujuan -->
<g class="c-gray">
  <rect x="70" y="220" width="200" height="88" rx="8" stroke-width="0.5"/>
  <text class="th" x="170" y="240" text-anchor="middle" dominant-baseline="central">Pilih tujuan backup</text>
  <text class="ts" x="170" y="260" text-anchor="middle" dominant-baseline="central">● Local disk (download)</text>
  <text class="ts" x="170" y="278" text-anchor="middle" dominant-baseline="central">● Google Drive (manual)</text>
  <text class="ts" x="170" y="296" text-anchor="middle" dominant-baseline="central">● GitHub Gist (private)</text>
</g>
<line x1="170" y1="308" x2="170" y2="340" class="arr" marker-end="url(#arr3)"/>

<!-- 4. Enkripsi -->
<g class="c-teal">
  <rect x="70" y="340" width="200" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="170" y="362" text-anchor="middle" dominant-baseline="central">Enkripsi AES-256-GCM</text>
</g>
<line x1="170" y1="384" x2="170" y2="416" class="arr" marker-end="url(#arr3)"/>

<!-- 5. Selesai -->
<g class="c-green">
  <rect x="70" y="416" width="200" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="170" y="438" text-anchor="middle" dominant-baseline="central">Backup selesai ✓</text>
</g>

<!-- ── RIGHT: RESTORE ── -->
<!-- 1. Start restore -->
<g class="c-purple">
  <rect x="410" y="40" width="200" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="510" y="62" text-anchor="middle" dominant-baseline="central">Mulai restore</text>
</g>
<line x1="510" y1="84" x2="510" y2="116" class="arr" marker-end="url(#arr3)"/>

<!-- 2. Upload file -->
<g class="c-gray">
  <rect x="410" y="116" width="200" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="510" y="138" text-anchor="middle" dominant-baseline="central">Upload file backup</text>
</g>
<line x1="510" y1="160" x2="510" y2="192" class="arr" marker-end="url(#arr3)"/>

<!-- 3. Verifikasi -->
<g class="c-gray">
  <rect x="410" y="192" width="200" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="510" y="212" text-anchor="middle" dominant-baseline="central">Verifikasi password</text>
  <text class="ts" x="510" y="232" text-anchor="middle" dominant-baseline="central">Salah → file gagal dibuka</text>
</g>
<line x1="510" y1="248" x2="510" y2="280" class="arr" marker-end="url(#arr3)"/>

<!-- 4. Pilih mode -->
<g class="c-gray">
  <rect x="410" y="280" width="200" height="72" rx="8" stroke-width="0.5"/>
  <text class="th" x="510" y="300" text-anchor="middle" dominant-baseline="central">Pilih mode restore</text>
  <text class="ts" x="510" y="320" text-anchor="middle" dominant-baseline="central">● Merge — gabung data</text>
  <text class="ts" x="510" y="338" text-anchor="middle" dominant-baseline="central">● Replace — ganti semua</text>
</g>
<line x1="510" y1="352" x2="510" y2="384" class="arr" marker-end="url(#arr3)"/>

<!-- 5. Selesai -->
<g class="c-green">
  <rect x="410" y="384" width="200" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="510" y="406" text-anchor="middle" dominant-baseline="central">Restore selesai ✓</text>
</g>

<!-- Cross-device note -->
<g class="c-amber">
  <rect x="410" y="444" width="200" height="48" rx="8" stroke-width="0.5"/>
  <text class="th" x="510" y="462" text-anchor="middle" dominant-baseline="central">Cross-device</text>
  <text class="ts" x="510" y="480" text-anchor="middle" dominant-baseline="central">Export A → Import B, password sama</text>
</g>
</svg>
</div>
</div>

</body>
</html>
